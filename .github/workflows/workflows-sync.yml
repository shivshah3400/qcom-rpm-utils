# =============================================================================
# Workflows Sync
# =============================================================================
# Syncs the canonical caller workflows from
# qcom-rpm-utils/.github/pkg-rpm-workflows/** into every qualcomm-linux
# pkg-rpm-* packaging repository, by opening a pull request against each repo.
#
# Layout is one subfolder per target branch, e.g.:
#   .github/pkg-rpm-workflows/c10s/*.yml   -> synced to each repo's `c10s` branch
# Add a new branch by creating a matching subfolder (e.g. `main/`); no change to
# this workflow is needed. Each target branch gets its own sync branch + PR.
#
# Manually triggered. Leave `confirmation` unticked for a dry run (lists repos
# and planned changes, creates no PRs). Use `repos` to sync only a subset of
# repositories instead of every pkg-rpm-* repo in the org.
# =============================================================================
name: Workflows Sync

on:
  workflow_dispatch:
    inputs:
      confirmation:
        type: boolean
        default: false
        required: true
        description: |
          Tick to confirm creating pull requests to sync workflows from
          qcom-rpm-utils to the pkg-rpm-* packaging repositories.
      repos:
        type: string
        required: false
        default: ""
        description: |
          Optional comma- or space-separated list of repositories to sync.

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: qcom-rpm-utils
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RPM_PKG_BOT_CI_APP_ID }}
          private-key: ${{ secrets.RPM_PKG_BOT_CI_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          owner: qualcomm-linux

      - name: Sync workflows from qcom-rpm-utils
        id: sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: qualcomm-linux
          BOT_NAME: ${{ vars.RPM_PKG_BOT_CI_NAME }}
          BOT_EMAIL: ${{ vars.RPM_PKG_BOT_CI_EMAIL }}
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
          REPOS_INPUT: ${{ inputs.repos }}
        run: |
          EXCLUDE_REPOS=()

          # Source-of-truth workflows, checked out under
          # qcom-rpm-utils/.github/pkg-rpm-workflows/. Each immediate subdir is
          # named after the target branch it is synced to (e.g. c10s/).
          SRC_ROOT="$(pwd)/qcom-rpm-utils/.github/pkg-rpm-workflows"

          COMMIT_MSG="chore: sync workflows from qcom-rpm-utils"

          # Arrays to store created PR URLs and non-fatal sync warnings.
          PR_URLS=()
          WARNINGS=()

          run_cmd() {
            "$@" 2>&1 | sed 's/^/    /'
            return ${PIPESTATUS[0]}
          }

          record_warning() {
            local warning="$1"
            WARNINGS+=("$warning")
            echo "    ⚠️ $warning"
          }

          create_or_reuse_pr() {
            local repo_name="$1"
            local title="$2"
            local body="$3"
            local head_branch="$4"
            local base_branch="$5"
            local pr_url=""
            local pr_error=""
            local pr_error_file

            pr_error_file="$(mktemp)"
            if pr_url=$(gh pr create --repo "$ORG/$repo_name" \
              --title "$title" \
              --body "$body" \
              --head "$head_branch" \
              --base "$base_branch" 2>"$pr_error_file"); then
              PR_URLS+=("$pr_url")
              echo "    ✅ PR created for $base_branch: $pr_url"
              rm -f "$pr_error_file"
              return 0
            fi

            pr_error="$(cat "$pr_error_file")"
            rm -f "$pr_error_file"

            if [[ "$pr_error" == *"A pull request already exists"* ]]; then
              pr_url=$(gh pr list --repo "$ORG/$repo_name" \
                --state open \
                --head "$head_branch" \
                --base "$base_branch" \
                --json url \
                --jq '.[0].url' 2>/dev/null || true)
              if [[ -n "$pr_url" ]]; then
                PR_URLS+=("$pr_url")
                echo "    ℹ️ Reusing existing PR for $base_branch: $pr_url"
                return 0
              fi
            fi

            record_warning "$repo_name:$base_branch PR creation failed: $pr_error"
            return 1
          }

          # Get the list of pkg-rpm-* packaging repositories.
          all_repos=$(gh repo list --limit 9999 "$ORG" --json name \
            --jq '.[] | select(.name | startswith("pkg-rpm-")) | .name')

          if [[ -n "${REPOS_INPUT//[[:space:],]/}" ]]; then
            repos=""
            for want in $(echo "$REPOS_INPUT" | tr ',' ' '); do
              if grep -qxF "$want" <<< "$all_repos"; then
                repos+="$want"$'\n'
              else
                record_warning "$want: not a pkg-rpm-* repository in $ORG, skipping"
              fi
            done

            if [[ -z "${repos//[[:space:]]/}" ]]; then
              echo "::error::None of the requested repositories matched a pkg-rpm-* repository in $ORG."
              echo "Requested: $REPOS_INPUT"
              exit 1
            fi

            echo "Syncing the requested subset of repositories:"
          else
            repos="$all_repos"
            echo "List of repositories starting with 'pkg-rpm-':"
          fi
          echo "$repos"

          for repo in $repos; do
            # Skip excluded repositories
            if [[ " ${EXCLUDE_REPOS[*]} " =~ " ${repo} " ]]; then
              echo "⏭️ Skipping excluded repository: $repo"
              continue
            fi

            echo "🔄 Checking repo: $repo"

            # Clone the target repository
            if ! run_cmd gh repo clone "$ORG/$repo" "$repo"; then
              record_warning "$repo: clone failed, skipping repository"
              continue
            fi

            if ! cd "$repo"; then
              record_warning "$repo: failed to enter cloned repository directory"
              continue
            fi

            # Configure git to use gh CLI for authentication (once per repo).
            gh auth setup-git
            git config user.name "$BOT_NAME"
            git config user.email "$BOT_EMAIL"

            for branch_dir in "$SRC_ROOT"/*/; do
              [[ -d "$branch_dir" ]] || continue
              target_branch="$(basename "$branch_dir")"
              sync_branch="sync/qcom-rpm-utils-workflows-${target_branch}"

              # Skip repos that don't have this branch.
              if ! git ls-remote --exit-code --heads origin "$target_branch" > /dev/null 2>&1; then
                record_warning "$repo: no $target_branch branch, skipping"
                continue
              fi

              if ! run_cmd git checkout "$target_branch"; then
                record_warning "$repo:$target_branch checkout failed"
                continue
              fi

              # Compare and sync this branch's workflow files.
              isDirty=false
              for workflow in "$branch_dir"*.yml; do
                [[ -e "$workflow" ]] || continue
                workflow_name=$(basename "$workflow")
                target_workflow=".github/workflows/$workflow_name"

                if [[ -f "$target_workflow" ]]; then
                  if diff -q "$workflow" "$target_workflow" > /dev/null; then
                    echo "    ✅ [$target_branch] $workflow_name is up to date"
                  else
                    echo "    ❌ [$target_branch] $workflow_name differs from qcom-rpm-utils"
                    cp "$workflow" "$target_workflow"
                    isDirty=true
                  fi
                else
                  echo "    + [$target_branch] Creating $workflow_name (missing from $repo)"
                  mkdir -p ".github/workflows"
                  cp "$workflow" "$target_workflow"
                  isDirty=true
                fi
              done

              if [[ "$isDirty" != "true" ]]; then
                echo "    ✨ [$target_branch] No changes needed for $repo"
                continue
              fi

              echo "    📝 [$target_branch] Creating branch and committing changes"
              if ! run_cmd git checkout -b "$sync_branch"; then
                record_warning "$repo:$target_branch failed to create sync branch"
                continue
              fi
              git add -A .github/
              if ! run_cmd git commit -s -m "$COMMIT_MSG"; then
                record_warning "$repo:$target_branch failed to commit sync"
                continue
              fi

              if [[ "$CONFIRMATION_INPUT" == "true" ]]; then
                echo "    🚀 [$target_branch] Pushing changes and creating PR"
                run_cmd git fetch origin "$sync_branch" || true
                if run_cmd git push --force-with-lease origin "$sync_branch"; then
                  create_or_reuse_pr \
                    "$repo" \
                    "$COMMIT_MSG" \
                    "This PR syncs the latest workflows from qcom-rpm-utils \`.github/pkg-rpm-workflows/${target_branch}/\`." \
                    "$sync_branch" \
                    "$target_branch" || true
                else
                  record_warning "$repo:$target_branch failed to push $sync_branch"
                fi
              else
                echo "    👀 [$target_branch] Dry-run mode - No PR will be created"
              fi
            done

            cd ..
          done

          # Output summary of created PRs
          if [[ "${#PR_URLS[@]}" -gt 0 ]]; then
            echo "🎉 Created PRs for the following repositories:"
            for pr_url in "${PR_URLS[@]}"; do
              echo "  - $pr_url"
            done
          else
            echo "ℹ️ No PRs were created."
          fi

          if [[ "${#WARNINGS[@]}" -gt 0 ]]; then
            echo "⚠️ Sync completed with warnings:"
            for warning in "${WARNINGS[@]}"; do
              echo "  - $warning"
            done
          else
            echo "✅ Sync completed with no warnings."
          fi
