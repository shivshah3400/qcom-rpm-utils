# =============================================================================
# Reusable RPM release workflow
# =============================================================================
# Called by pkg-rpm-* packaging repos to build and publish a released RPM to
# JFrog Artifactory. Mirrors the Ubuntu pkg-release-reusable-workflow.yml:
#   1. build   - reuses pkg-build-reusable-workflow.yml (release=true, so any
#                upstream-fetched source tarballs are cached back).
#   2. publish - gated by the `pkg-release-approval` environment; downloads the
#                build artifact and uploads the RPMs to Artifactory.
# =============================================================================
name: Reusable RPM Release

on:
  workflow_call:
    inputs:
      qcom-rpm-utils-ref:
        description: "Git ref of qcom-rpm-utils to pin the build tooling to"
        type: string
        required: false
        default: main
      builder-image:
        description: "Override the rpm-builder toolchain image (default: ghcr.io/<owner>/rpm-builder:centos10)"
        type: string
        required: false
        default: ""
      extra-repo:
        description: "Extra dnf repo URL to register for BuildRequires resolution"
        type: string
        required: false
        default: ""
      cache-base-url:
        description: >
          Overrides the lookaside cache URL. Empty (the default) derives it from
          the resolved target repo, which is what callers should normally use
        type: string
        required: false
        default: ""
      cache-path-template:
        description: "Lookaside path template appended to cache-base-url"
        type: string
        required: false
        default: "{filename}/{hashtype}/{hash}/{filename}"
      publish-target:
        description: >
          Artifactory environment to publish to: "staging" (default) or "prod".
        type: string
        required: false
        default: "staging"
      server-url:
        description: "Artifactory server URL"
        type: string
        required: false
        default: "https://qartifactory.pe.jfrog.io"
      target-repo:
        description: >
          Overrides the repo derived from publish-target. Empty (the default)
          derives it, which is what callers should normally use.
        type: string
        required: false
        default: ""
      distro:
        description: "Distribution name; first path segment under target-repo"
        type: string
        required: false
        default: "centos"
      distro-version:
        description: "Distribution major version"
        type: string
        required: false
        default: "10"
      channel:
        description: "Release channel directory (os, nightly)"
        type: string
        required: false
        default: "os"
    secrets:
      QSC_API_KEY:
        description: "Staging QSC API key. Takes precedence over ARTIFACTORY_ACCESS_TOKEN when both are set."
        required: false
      ARTIFACTORY_ACCESS_TOKEN:
        description: "Staging Artifactory access token. Used when QSC_API_KEY is not set."
        required: false
      PROD_QSC_API_KEY:
        description: "Prod QSC API key. Used only when publish-target is 'prod'. Takes precedence over PROD_ARTIFACTORY_ACCESS_TOKEN."
        required: false
      PROD_ARTIFACTORY_ACCESS_TOKEN:
        description: "Prod Artifactory access token. Used only when publish-target is 'prod', when PROD_QSC_API_KEY is not set."
        required: false

permissions:
  contents: read
  packages: read

jobs:
  preflight:
    name: Validate release target
    runs-on: [self-hosted, platform-prd-u2404-arm64-large-od-ephem]
    steps:
      - name: Check publish target and credentials
        env:
          PUBLISH_TARGET: ${{ inputs.publish-target }}
          QSC_API_KEY: ${{ secrets.QSC_API_KEY }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          PROD_QSC_API_KEY: ${{ secrets.PROD_QSC_API_KEY }}
          PROD_ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.PROD_ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          case "${PUBLISH_TARGET}" in
            staging)
              api_key="${QSC_API_KEY}"
              token="${ARTIFACTORY_ACCESS_TOKEN}"
              api_name="QSC_API_KEY"
              token_name="ARTIFACTORY_ACCESS_TOKEN"
              ;;
            prod)
              api_key="${PROD_QSC_API_KEY}"
              token="${PROD_ARTIFACTORY_ACCESS_TOKEN}"
              api_name="PROD_QSC_API_KEY"
              token_name="PROD_ARTIFACTORY_ACCESS_TOKEN"
              ;;
            *)
              echo "::error::Unknown publish-target '${PUBLISH_TARGET}'. Use 'staging' or 'prod'."
              exit 1
              ;;
          esac

          if [[ -n "${api_key}" ]]; then
            echo "Publishing to ${PUBLISH_TARGET} using ${api_name}."
          elif [[ -n "${token}" ]]; then
            echo "Publishing to ${PUBLISH_TARGET} using ${token_name}."
          else
            echo "::error::No credential for publish-target '${PUBLISH_TARGET}'." \
                 "Set either ${api_name} or ${token_name} on this repository."
            exit 1
          fi

  build:
    name: Build
    needs: preflight
    uses: ./.github/workflows/pkg-build-reusable-workflow.yml
    with:
      qcom-rpm-utils-ref: ${{ inputs.qcom-rpm-utils-ref }}
      builder-image: ${{ inputs.builder-image }}
      extra-repo: ${{ inputs.extra-repo }}
      release: true
      cache-base-url: ${{ inputs.cache-base-url }}
      cache-path-template: ${{ inputs.cache-path-template }}
      publish-target: ${{ inputs.publish-target }}
      target-repo: ${{ inputs.target-repo }}
      server-url: ${{ inputs.server-url }}
      distro: ${{ inputs.distro }}
      distro-version: ${{ inputs.distro-version }}
      channel: ${{ inputs.channel }}
    secrets:
      QSC_API_KEY: ${{ secrets.QSC_API_KEY }}
      ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
      PROD_QSC_API_KEY: ${{ secrets.PROD_QSC_API_KEY }}
      PROD_ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.PROD_ARTIFACTORY_ACCESS_TOKEN }}

  approve-prod:
    name: Approve prod publish
    needs: build
    if: ${{ inputs.publish-target == 'prod' }}
    runs-on: [self-hosted, platform-prd-u2404-arm64-large-od-ephem]
    environment: pkg-release-approval
    steps:
      - name: Approved
        env:
          TARGET_REPO: ${{ needs.build.outputs.target-repo }}
          PKG_NAME: ${{ needs.build.outputs.pkg-name }}
          PKG_VERSION: ${{ needs.build.outputs.pkg-version }}
        run: |
          echo "Approved publishing ${PKG_NAME}-${PKG_VERSION} to ${TARGET_REPO}."

  publish:
    name: Publish to Artifactory
    needs: [build, approve-prod]
    if: >-
      ${{ always()
          && needs.build.result == 'success'
          && (inputs.publish-target != 'prod' || needs.approve-prod.result == 'success') }}
    runs-on: [self-hosted, platform-prd-u2404-arm64-large-od-ephem]
    steps:
      - name: Checkout tooling (qcom-rpm-utils)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: qualcomm-linux/qcom-rpm-utils
          ref: ${{ inputs.qcom-rpm-utils-ref }}
          path: qcom-rpm-utils
          sparse-checkout: .github/actions

      - name: Download built RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: output

      - name: Build provenance metadata
        id: prov
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          PKG_NAME: ${{ needs.build.outputs.pkg-name }}
          PKG_VERSION: ${{ needs.build.outputs.pkg-version }}
        run: |
          set -euo pipefail
          workflow_url="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          jq -n \
            --arg commit "${COMMIT_SHA}" \
            --arg workflow "$workflow_url" \
            --arg pkg "${PKG_NAME}" \
            --arg version "${PKG_VERSION}" \
            '{commit:$commit, workflow:$workflow, pkg:$pkg, version:$version}' \
            > provenance.json
          {
            echo 'provenance<<EOF'
            cat provenance.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload RPMs to Artifactory
        uses: ./qcom-rpm-utils/.github/actions/rpm-artifactory-upload
        with:
          server_url: ${{ inputs.server-url }}
          target_repo: ${{ needs.build.outputs.target-repo }}
          distro: ${{ inputs.distro }}
          distro_version: ${{ inputs.distro-version }}
          channel: ${{ inputs.channel }}
          rpm_dir: output
          provenance_info: ${{ steps.prov.outputs.provenance }}
          publish_target: ${{ inputs.publish-target }}
          qsc_api_key: ${{ secrets.QSC_API_KEY }}
          access_token: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          prod_qsc_api_key: ${{ secrets.PROD_QSC_API_KEY }}
          prod_access_token: ${{ secrets.PROD_ARTIFACTORY_ACCESS_TOKEN }}

      - name: Job summary
        if: always()
        env:
          PKG_NAME: ${{ needs.build.outputs.pkg-name }}
          PKG_VERSION: ${{ needs.build.outputs.pkg-version }}
          PUBLISH_TARGET: ${{ inputs.publish-target }}
          TARGET_REPO: ${{ needs.build.outputs.target-repo }}
          DISTRO: ${{ inputs.distro }}
          DISTRO_VERSION: ${{ inputs.distro-version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          base="${TARGET_REPO}/${DISTRO}/${DISTRO_VERSION}/${CHANNEL}"
          {
            echo "## Published RPMs"
            echo ""
            echo "- Target: \`${PUBLISH_TARGET}\` (\`${TARGET_REPO}\`)"
            echo "- Package: \`${PKG_NAME}-${PKG_VERSION}\`"
            echo "- Binary RPMs: \`${base}/<arch>/Packages/\`"
            echo "- Source RPMs: \`${base}/SRPMS/Packages/\`"
          } >> "$GITHUB_STEP_SUMMARY"
