# =============================================================================
# Reusable RPM build workflow
# =============================================================================
# Called by pkg-rpm-* packaging repos (and by pkg-release-reusable-workflow.yml)
# to build the package's RPM(s) from a `sources` file + a `.spec`.
#
# =============================================================================
name: Reusable RPM Build

on:
  workflow_call:
    inputs:
      qcom-rpm-utils-ref:
        description: "Git ref of qcom-rpm-utils to pin the build tooling to"
        type: string
        required: false
        default: main
      pkg-ref:
        description: >
          Git ref/SHA of the package repo to build. Empty uses the default
          checkout, which is correct for pull_request. Required under
          pull_request_target, where the default ref is the base branch rather
          than the PR head
        type: string
        required: false
        default: ""
      builder-image:
        description: "Override the rpm-builder toolchain image (default: ghcr.io/<owner>/rpm-builder:centos10)"
        type: string
        required: false
        default: ""
      extra-repo:
        description: "Extra dnf repo URL to register for BuildRequires resolution"
        type: string
        required: false
        default: ""
      release:
        description: "Release build: cache verified upstream tarballs back to Artifactory"
        type: boolean
        required: false
        default: false
      cache-base-url:
        description: >
          Overrides the lookaside cache URL. Empty (the default) derives it from
          the resolved target repo, which is what callers should normally use
        type: string
        required: false
        default: ""
      cache-path-template:
        description: "Lookaside path template appended to cache-base-url"
        type: string
        required: false
        default: "{filename}/{hashtype}/{hash}/{filename}"
      publish-target:
        description: >
          Selects the target repo, and with it the lookaside cache and default extra-repo
          URLs. Prod is publicly readable, so builds against it need no token.
        type: string
        required: false
        default: "staging"
      server-url:
        description: "Artifactory server URL used for source cache-back (release only)"
        type: string
        required: false
        default: "https://qartifactory.pe.jfrog.io"
      target-repo:
        description: >
          Overrides the repo derived from publish-target. Empty (the default)
          derives it, which is what callers should normally use.
        type: string
        required: false
        default: ""
      distro:
        description: "Distribution name; first path segment under the target repo. Must match the release workflow, or the extra dnf repo points at a tree nothing publishes to."
        type: string
        required: false
        default: "centos"
      distro-version:
        description: "Distribution major version"
        type: string
        required: false
        default: "10"
      channel:
        description: "Release channel directory (os, nightly)"
        type: string
        required: false
        default: "os"
    secrets:
      QSC_API_KEY:
        description: "Staging QSC API key for source cache-back (release only). Takes precedence over ARTIFACTORY_ACCESS_TOKEN."
        required: false
      ARTIFACTORY_ACCESS_TOKEN:
        description: "Staging Artifactory access token for source cache-back (release only). Used when QSC_API_KEY is not set."
        required: false
      PROD_QSC_API_KEY:
        description: "Prod QSC API key. Used only when publish-target is 'prod'. Takes precedence over PROD_ARTIFACTORY_ACCESS_TOKEN."
        required: false
      PROD_ARTIFACTORY_ACCESS_TOKEN:
        description: "Prod Artifactory access token. Used only when publish-target is 'prod', when PROD_QSC_API_KEY is not set."
        required: false
    outputs:
      artifact-name:
        description: "Name of the uploaded RPM build artifact"
        value: ${{ jobs.build.outputs.artifact-name }}
      pkg-name:
        description: "Package name resolved from the spec"
        value: ${{ jobs.build.outputs.pkg-name }}
      pkg-version:
        description: "Package version resolved from the spec"
        value: ${{ jobs.build.outputs.pkg-version }}
      target-repo:
        description: "Artifactory repo resolved from publish-target, for the caller's publish step"
        value: ${{ jobs.build.outputs.target-repo }}

permissions:
  contents: read
  packages: read

env:
  BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  S3_BUCKET: "qli-prd-platform-gh-artifacts"
  FILESERVER_URL: "https://qli-prod-artifacts.qualcomm.com"
  STAGING_REPO: "qsc-rpm-releases-stage"
  PROD_REPO: "qsc-rpm-releases"

jobs:
  build:
    name: Build RPM
    runs-on: [self-hosted, platform-prd-u2404-arm64-large-od-ephem]
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}
      pkg-name: ${{ steps.meta.outputs.pkg-name }}
      pkg-version: ${{ steps.meta.outputs.pkg-version }}
      target-repo: ${{ steps.target.outputs.target_repo }}
    steps:
      - name: Resolve publish target
        id: target
        env:
          PUBLISH_TARGET: ${{ inputs.publish-target }}
          TARGET_REPO_INPUT: ${{ inputs.target-repo }}
          SERVER_URL: ${{ inputs.server-url }}
          DISTRO: ${{ inputs.distro }}
          DISTRO_VERSION: ${{ inputs.distro-version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          case "${PUBLISH_TARGET}" in
            staging) target_repo="${STAGING_REPO}" ;;
            prod)    target_repo="${PROD_REPO}" ;;
            *)
              echo "::error::Unknown publish-target '${PUBLISH_TARGET}'. Use 'staging' or 'prod'."
              exit 1
              ;;
          esac

          if [[ -n "${TARGET_REPO_INPUT}" ]]; then
            echo "target-repo override in effect: ${TARGET_REPO_INPUT} (publish-target=${PUBLISH_TARGET})"
            target_repo="${TARGET_REPO_INPUT}"
          fi

          artifactory_base="${SERVER_URL%/}/artifactory"
          tree="${DISTRO}/${DISTRO_VERSION}/${CHANNEL}"
          {
            echo "target_repo=${target_repo}"
            echo "cache_base_url=${artifactory_base}/${target_repo}/sources"
            echo "extra_repo=${artifactory_base}/${target_repo}/${tree}/\$basearch"
          } >> "$GITHUB_OUTPUT"

          echo "publish-target : ${PUBLISH_TARGET}"
          echo "target repo    : ${target_repo}"
          echo "tree           : ${tree}"

      - name: Checkout package repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: pkg
          ref: ${{ inputs.pkg-ref }}

      - name: Checkout build tooling (qcom-rpm-utils)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: qualcomm-linux/qcom-rpm-utils
          ref: ${{ inputs.qcom-rpm-utils-ref }}
          path: qcom-rpm-utils
          sparse-checkout: |
            scripts
            .github/actions

      - name: Install rpm tooling
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq --no-install-recommends rpm

      - name: Locate spec file
        id: spec
        working-directory: pkg
        run: |
          set -euo pipefail
          mapfile -t specs < <(find . -maxdepth 1 -name '*.spec' -type f | sort)
          if [[ "${#specs[@]}" -eq 0 ]]; then
            echo "::error::No '*.spec' file found at the repo root." >&2
            exit 1
          fi
          if [[ "${#specs[@]}" -gt 1 ]]; then
            echo "::error::Multiple spec files found (${specs[*]}). One package per repo." >&2
            exit 1
          fi
          echo "spec=${specs[0]}" >> "$GITHUB_OUTPUT"
          echo "Using spec: ${specs[0]}"

      - name: Resolve and verify source tarballs
        id: sources
        working-directory: pkg
        env:
          CACHE_BASE_URL: ${{ inputs.cache-base-url }}
          CACHE_PATH_TEMPLATE: ${{ inputs.cache-path-template }}
          SPEC_FILE: ${{ steps.spec.outputs.spec }}
          IS_RELEASE: ${{ inputs.release }}
          DEFAULT_CACHE_BASE_URL: ${{ steps.target.outputs.cache_base_url }}
          TARGET_REPO: ${{ steps.target.outputs.target_repo }}
        run: |
          set -euo pipefail
          if [[ ! -f sources ]]; then
            echo "::error::No 'sources' file found at the repo root." >&2
            exit 1
          fi
          if [[ -z "${CACHE_BASE_URL}" ]]; then
            CACHE_BASE_URL="${DEFAULT_CACHE_BASE_URL}"
            echo "cache-base-url derived from the target repo: ${CACHE_BASE_URL}"
          elif [[ "${CACHE_BASE_URL}" != *"/${TARGET_REPO}/"* ]]; then
            echo "::warning::cache-base-url (${CACHE_BASE_URL}) does not reference the" \
                 "target repo '${TARGET_REPO}'. Cache reads will not match where sources" \
                 "are cached back, so every lookup will miss. Leave cache-base-url empty" \
                 "to derive it as ${DEFAULT_CACHE_BASE_URL}"
          fi
          emit=""
          if [[ "${IS_RELEASE}" == "true" ]]; then
            emit="--emit-cache-uploads"
          fi
          bash ../qcom-rpm-utils/scripts/resolve-sources.sh \
            --sources sources \
            --spec "${SPEC_FILE}" \
            --cache-base-url "${CACHE_BASE_URL}" \
            --path-template "${CACHE_PATH_TEMPLATE}" \
            --dest sources-cache \
            ${emit}

      - name: Cache source tarballs back to Artifactory
        if: ${{ inputs.release && hashFiles('pkg/sources-cache/.cache-uploads') != '' }}
        uses: ./qcom-rpm-utils/.github/actions/rpm-artifactory-upload
        with:
          server_url: ${{ inputs.server-url }}
          target_repo: ${{ steps.target.outputs.target_repo }}
          rpm_dir: pkg/sources-cache
          cache_uploads_manifest: pkg/sources-cache/.cache-uploads
          publish_target: ${{ inputs.publish-target }}
          qsc_api_key: ${{ secrets.QSC_API_KEY }}
          access_token: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          prod_qsc_api_key: ${{ secrets.PROD_QSC_API_KEY }}
          prod_access_token: ${{ secrets.PROD_ARTIFACTORY_ACCESS_TOKEN }}

      - name: Log in to GHCR (pull rpm-builder image)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build RPMs
        working-directory: pkg
        env:
          BUILDER_IMAGE_INPUT: ${{ inputs.builder-image }}
          REPO_OWNER: ${{ github.repository_owner }}
          TARBALL: ${{ steps.sources.outputs.tarball }}
          SPEC_FILE: ${{ steps.spec.outputs.spec }}
          EXTRA_REPO: ${{ inputs.extra-repo }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          DEFAULT_EXTRA_REPO: ${{ steps.target.outputs.extra_repo }}
          PUBLISH_TARGET: ${{ inputs.publish-target }}
        run: |
          set -euo pipefail
          chmod +x ../qcom-rpm-utils/scripts/build-rpm.sh
          builder_image="${BUILDER_IMAGE_INPUT}"
          if [[ -z "${builder_image}" ]]; then
            owner="$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
            builder_image="ghcr.io/${owner}/rpm-builder:centos10"
          fi
          args=(--tarball "${TARBALL}"
                --spec "${SPEC_FILE}"
                --output ./output
                --builder-image "${builder_image}")
          if [[ -z "${EXTRA_REPO}" ]]; then
            if [[ "${PUBLISH_TARGET}" == "prod" ]]; then
              echo "::warning::extra-repo input is empty. Falling back to default: ${DEFAULT_EXTRA_REPO}"
              EXTRA_REPO="${DEFAULT_EXTRA_REPO}"
            elif [[ -n "${ARTIFACTORY_ACCESS_TOKEN}" ]]; then
              echo "::warning::extra-repo input is empty. Falling back to default: ${DEFAULT_EXTRA_REPO}"
              EXTRA_REPO="https://:${ARTIFACTORY_ACCESS_TOKEN}@${DEFAULT_EXTRA_REPO#https://}"
            else
              echo "::warning::extra-repo is empty and no ARTIFACTORY_ACCESS_TOKEN is available"
            fi
          fi
          if [[ -n "${EXTRA_REPO}" ]]; then
            args+=(--extra-repo "${EXTRA_REPO}")
          fi
          ../qcom-rpm-utils/scripts/build-rpm.sh "${args[@]}"

      - name: Checksum built packages
        working-directory: pkg
        run: |
          set -euo pipefail
          shopt -s nullglob
          rpms=(output/*.rpm)
          if [[ "${#rpms[@]}" -eq 0 ]]; then
            echo "::error::Build produced no RPMs." >&2
            exit 1
          fi
          (cd output && sha256sum ./*.rpm | tee sha256sums.txt)

      - name: Resolve package metadata
        id: meta
        working-directory: pkg
        env:
          SPEC_FILE: ${{ steps.spec.outputs.spec }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          name="$(rpmspec -q --srpm --qf '%{name}\n' "${SPEC_FILE}" 2>/dev/null | head -n1 || true)"
          version="$(rpmspec -q --srpm --qf '%{version}\n' "${SPEC_FILE}" 2>/dev/null | head -n1 || true)"
          artifact="rpms-${name:-pkg}-${RUN_ID}"
          {
            echo "pkg-name=${name}"
            echo "pkg-version=${version}"
            echo "artifact-name=${artifact}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload built RPMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: |
            pkg/output/*.rpm
            pkg/output/sha256sums.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish RPMs to S3
        id: upload_rpms_s3
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        with:
          path: pkg/output
          s3_bucket: ${{ env.S3_BUCKET }}
          destination: qualcomm-linux/pkg/proposed/${{ env.BUILD_ID }}/
          fileserver_url: ${{ env.FILESERVER_URL }}

      - name: Print RPM download URL
        env:
          RPMS_URL: ${{ steps.upload_rpms_s3.outputs.url }}
        run: |
          set -euo pipefail
          echo "RPMs URL: ${RPMS_URL}"
          {
            echo "## S3 artifacts"
            echo ""
            echo "- RPMs: ${RPMS_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Job summary
        if: always()
        working-directory: pkg
        run: |
          set -euo pipefail
          {
            echo "## Built packages"
            if compgen -G "output/*.rpm" > /dev/null; then
              echo ""
              echo '```'
              (cd output && ls -1 ./*.rpm)
              echo '```'
            else
              echo ""
              echo "_No packages were produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: build
    if: ${{ vars.AXIOM_ENABLE == 'true' }}
    uses: ./.github/workflows/test.yml
