name: "Upload RPMs to Artifactory"
description: "Uploads built RPM/SRPM packages to a JFrog Artifactory repository."


inputs:
  server_url:
    description: "Artifactory server URL"
    required: false
    default: "https://qartifactory.pe.jfrog.io/"

  target_repo:
    description: "Target YUM/RPM repo name, optionally with a path prefix"
    required: false
    default: "qsc-rpm-releases-stage"

  rpm_dir:
    description: "Directory containing the built *.rpm / *.src.rpm files to upload"
    required: false
    default: "output"

  distro:
    description: "Distribution name; first path segment under target_repo (e.g. centos)."
    required: false
    default: "centos"

  distro_version:
    description: "Distribution major version (e.g. 10)."
    required: false
    default: "10"

  channel:
    description: "Release channel directory (e.g. os, nightly)."
    required: false
    default: "os"

  cache_uploads_manifest:
    description: >
      Optional path to a TAB-separated manifest of source tarballs to cache back:
      each line is 'localpath<TAB>cache-relative-path'. Uploaded under
      <target_repo>/sources/<cache-relative-path>. Produced by resolve-sources.sh
      --emit-cache-uploads.
    required: false
    default: ""

  provenance_info:
    description: "Extra Artifactory properties as a JSON object (e.g. {\"commit\":\"...\",\"workflow\":\"...\"})"
    required: false
    default: "{}"

  publish_target:
    description: >
      Which credential pair to use: "staging" (default) or "prod".
    required: false
    default: "staging"

  access_token:
    description: "Staging Artifactory access token. Used when qsc_api_key is not set, and as a fallback if the qsc_api_key exchange fails."
    required: false

  qsc_api_key:
    description: "Staging QSC API key. When set, it is exchanged for a temporary Artifactory access token (takes precedence over access_token)."
    required: false

  prod_access_token:
    description: "Prod Artifactory access token. Used when publish_target is 'prod' and prod_qsc_api_key is not set."
    required: false

  prod_qsc_api_key:
    description: "Prod QSC API key. Used when publish_target is 'prod'; takes precedence over prod_access_token."
    required: false

  access_token_url:
    description: >
      QSC endpoint that exchanges qsc_api_key for an Artifactory token.
    required: false
    default: "https://api.qualcomm.com/softwarecenter/v1/chipSoftware/artifactory/tokens"

  access_token_data:
    description: "Access token data for generating access token - used in conjunction with qsc_api_key"
    required: false
    default: "{\"softwareName\":\"LU.QCLINUX\",\"softwareType\":\"SoftwareImage\",\"releaseTag\":\"2.0\"}"

runs:
  using: "composite"
  steps:

    - name: Install dependencies if needed
      shell: bash
      run: |
        set -euo pipefail
        SUDO=sudo
        if [ "$(id -u)" = 0 ]; then SUDO=""; fi

        required=(jq curl)
        missing=()
        for pkg in "${required[@]}"; do
          if ! command -v "$pkg" >/dev/null 2>&1; then
            missing+=("$pkg")
          fi
        done

        if ((${#missing[@]})); then
          echo "Installing missing packages: ${missing[*]}"
          if command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y "${missing[@]}"
          elif command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            $SUDO apt-get update -y -qq
            $SUDO apt-get install -y -qq --no-install-recommends "${missing[@]}"
          else
            echo "ERROR: no supported package manager (dnf/apt-get) to install: ${missing[*]}" >&2
            exit 1
          fi
        else
          echo "All prerequisites already installed."
        fi

    - name: Setup JFrog CLI
      uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e # v5
      with:
        version: 2.113.0

    - name: Resolve Artifactory access token
      id: gen_token
      shell: bash
      env:
        ACCESS_TOKEN_URL: ${{ inputs.access_token_url }}
        PUBLISH_TARGET: ${{ inputs.publish_target }}
        QSC_API_KEY: ${{ inputs.qsc_api_key }}
        ACCESS_TOKEN: ${{ inputs.access_token }}
        PROD_QSC_API_KEY: ${{ inputs.prod_qsc_api_key }}
        PROD_ACCESS_TOKEN: ${{ inputs.prod_access_token }}
        ACCESS_TOKEN_DATA: ${{ inputs.access_token_data }}
      run: |
        set -euo pipefail

        case "${PUBLISH_TARGET}" in
          staging)
            qsc_key="${QSC_API_KEY}"
            token="${ACCESS_TOKEN}"
            qsc_name="qsc_api_key"
            token_name="access_token"
            ;;
          prod)
            qsc_key="${PROD_QSC_API_KEY}"
            token="${PROD_ACCESS_TOKEN}"
            qsc_name="prod_qsc_api_key"
            token_name="prod_access_token"
            ;;
          *)
            echo "::error::Unknown publish_target '${PUBLISH_TARGET}'. Use 'staging' or 'prod'."
            exit 1
            ;;
        esac

        echo "Credential set: ${PUBLISH_TARGET}"

        if [ -z "$qsc_key" ] && [ -z "$token" ]; then
          echo "::error::Neither ${qsc_name} nor ${token_name} is set, which are the" \
               "credentials for publish_target '${PUBLISH_TARGET}'." >&2
          exit 1
        fi

        emit_token() {
          echo "::add-mask::$1"
          echo "access_token=$1" >> "$GITHUB_OUTPUT"
        }

        if [ -z "$qsc_key" ]; then
          echo "No ${qsc_name} provided; using ${token_name}."
          emit_token "$token"
          exit 0
        fi

        echo "Generating access token using ${qsc_name}..."
        if [ -n "$token" ]; then
          echo "Note: both credentials are set; ${qsc_name} takes precedence." \
               "${token_name} is kept only as a fallback."
        fi

        http_code=""
        body=""
        if response=$(curl -sS \
          -w '\n%{http_code}' \
          --retry 3 --retry-delay 2 --max-time 60 \
          -X POST "$ACCESS_TOKEN_URL" \
          -H 'Content-Type: application/json' \
          -H 'X-QCOM-TokenType: apikey' \
          -H "Authorization: $qsc_key" \
          -d "$ACCESS_TOKEN_DATA"); then
          http_code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "Token endpoint HTTP status: ${http_code}"
          echo "Token endpoint response (token redacted):"
          echo "$body" | jq 'if has("token") then .token = "***REDACTED***" else . end' 2>/dev/null \
            || echo "$body" | sed -E 's/"token"[[:space:]]*:[[:space:]]*"[^"]*"/"token":"***REDACTED***"/g'
        else
          echo "Token endpoint request failed (curl exit $?)."
        fi

        token_from_api="$(printf '%s' "$body" | jq -r '.token // empty' 2>/dev/null || true)"

        if [ -n "$token_from_api" ]; then
          emit_token "$token_from_api"
          echo "Access token generated successfully."
          exit 0
        fi

        if [ -n "$token" ]; then
          echo "::warning::Could not obtain a token from ${qsc_name} (HTTP ${http_code:-n/a})." \
               "Falling back to ${token_name}."
          emit_token "$token"
          exit 0
        fi

        echo "::error::Failed to generate an access token from ${qsc_name}"
        echo "HTTP status: ${http_code:-n/a}"
        exit 1

    - name: Configure JFrog server
      shell: bash
      env:
        SERVER_ID: "artifactory-server"
        SERVER_URL: ${{ inputs.server_url }}
        ACCESS_TOKEN: ${{ steps.gen_token.outputs.access_token }}
      run: |
        set -euo pipefail
        jf c remove "$SERVER_ID" --quiet 2>/dev/null || true
        jf c add "$SERVER_ID" \
          --url "$SERVER_URL" \
          --access-token "$ACCESS_TOKEN" \
          --interactive=false \
          --overwrite
        echo "JFrog CLI configured with server ID: $SERVER_ID"
        echo "Server URL: $SERVER_URL"

    - name: Resolve upload targets and block duplicate versions
      id: targets
      shell: bash
      env:
        SERVER_ID: "artifactory-server"
        TARGET_REPO: ${{ inputs.target_repo }}
        DISTRO: ${{ inputs.distro }}
        DISTRO_VERSION: ${{ inputs.distro_version }}
        CHANNEL: ${{ inputs.channel }}
        RPM_DIR: ${{ inputs.rpm_dir }}
        MANIFEST: ${{ inputs.cache_uploads_manifest }}
      run: |
        set -euo pipefail
        TARGETS="${RUNNER_TEMP}/rpm-upload-targets.tsv"
        : > "$TARGETS"
        echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

        shopt -s nullglob
        rpms=()
        if [ -d "$RPM_DIR" ]; then
          rpms=("$RPM_DIR"/*.rpm)
        fi

        if [ "${#rpms[@]}" -eq 0 ]; then
          if [ -n "$MANIFEST" ]; then
            echo "No RPMs in '$RPM_DIR'; skipping RPM upload (cache-back only)."
            exit 0
          fi
          echo "::error::no *.rpm files found in '$RPM_DIR'"
          exit 1
        fi

        BASE_DIR="${TARGET_REPO}/${DISTRO}/${DISTRO_VERSION}/${CHANNEL}"
        echo "Upload base: $BASE_DIR"

        for f in "${rpms[@]}"; do
          base="$(basename "$f")"
          arch="${base%.rpm}"; arch="${arch##*.}"

          arch_dir="$arch"
          if [ "$arch" = "src" ]; then
            arch_dir="SRPMS"
          fi

          printf '%s\t%s\t%s\n' "$f" "${BASE_DIR}/${arch_dir}/Packages/" "$arch" >> "$TARGETS"
        done

        conflicts=()
        while IFS=$'\t' read -r f target_dir arch; do
          base="$(basename "$f")"
          err="$(mktemp)"
          if ! raw="$(jf rt search --server-id="$SERVER_ID" "${target_dir}${base}" 2>"$err")"; then
            echo "::error::Artifactory search failed for ${target_dir}${base}; cannot verify whether it already exists."
            sed 's/^/    /' "$err"
            rm -f "$err"
            exit 1
          fi
          rm -f "$err"

          if ! hits="$(printf '%s' "$raw" | jq 'length' 2>/dev/null)"; then
            echo "::error::Could not parse Artifactory search response for ${target_dir}${base}."
            exit 1
          fi

          if [ "${hits:-0}" -gt 0 ]; then
            conflicts+=("${target_dir}${base}")
          fi
        done < "$TARGETS"

        if [ "${#conflicts[@]}" -eq 0 ]; then
          echo "No already-published artifacts found; safe to upload."
          exit 0
        fi

        echo "::error::Refusing to overwrite ${#conflicts[@]} already-published artifact(s):"
        printf '::error::  %s\n' "${conflicts[@]}"
        echo "::error::Bump the version or release in the spec to publish."
        exit 1

    - name: Upload RPMs with architecture detection
      shell: bash
      env:
        SERVER_ID: "artifactory-server"
        RPM_DIR: ${{ inputs.rpm_dir }}
        PROVENANCE_INFO: ${{ inputs.provenance_info }}
        MANIFEST: ${{ inputs.cache_uploads_manifest }}
        TARGETS: ${{ steps.targets.outputs.targets }}
      run: |
        set -euo pipefail

        if [ ! -s "$TARGETS" ]; then
          echo "No RPMs to upload (cache-back only)."
          exit 0
        fi

        PROPS=""
        for key in $(echo "$PROVENANCE_INFO" | jq -r 'keys[]'); do
          val=$(echo "$PROVENANCE_INFO" | jq -r --arg k "$key" '.[$k]')
          PROPS="${PROPS:+${PROPS};}${key}=${val}"
        done

        while IFS=$'\t' read -r f target_dir arch; do
          base="$(basename "$f")"
          fileprops="${PROPS:+${PROPS};}rpm.arch=${arch}"

          echo "Uploading $base (arch=${arch}) -> $target_dir"
          jf rt upload \
            --server-id="$SERVER_ID" \
            --flat=true \
            --target-props "${fileprops}" \
            "$f" \
            "$target_dir"
        done < "$TARGETS"

    - name: Cache back source tarballs
      if: ${{ inputs.cache_uploads_manifest != '' }}
      shell: bash
      env:
        SERVER_ID: "artifactory-server"
        TARGET_REPO: ${{ inputs.target_repo }}
        MANIFEST: ${{ inputs.cache_uploads_manifest }}
      run: |
        set -euo pipefail

        if [ ! -s "$MANIFEST" ]; then
          echo "No source tarballs to cache back (manifest empty or missing): $MANIFEST"
          exit 0
        fi

        while IFS=$'\t' read -r local rel || [ -n "$local" ]; do
          [ -z "$local" ] && continue
          if [ ! -f "$local" ]; then
            echo "ERROR: cache-back source not found: $local" >&2
            exit 1
          fi
          target="${TARGET_REPO}/sources/${rel}"
          echo "Caching source $local -> $target"
          jf rt upload \
            --server-id="$SERVER_ID" \
            --flat=true \
            "$local" \
            "$target"
        done < "$MANIFEST"
